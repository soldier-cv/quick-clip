name: CI

# push / PR：编译 + 发布冒烟，不发 Release
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore QuickClip.sln

      - name: Build (Debug)
        run: dotnet build QuickClip.sln -c Debug --no-restore -warnaserror

      - name: Publish smoke (Release win-x64)
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'qc-publish'
          dotnet publish src/QuickClip/QuickClip.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=1.0.0 `
            -p:AssemblyVersion=1.0.0.0 `
            -p:FileVersion=1.0.0.0 `
            -o $out
          $exe = Join-Path $out 'QuickClip.exe'
          if (-not (Test-Path $exe)) { throw "Publish failed: $exe missing" }
          $len = (Get-Item $exe).Length
          if ($len -lt 1MB) { throw "Artifact too small: $len bytes" }
          Write-Host "OK QuickClip.exe $len bytes"
