name: Build and Release

# 仅 tag v* 或手动触发；普通 push 不发版
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $ver = '1.0.0'
          if ("${{ github.ref_type }}" -eq 'tag') {
            $t = "${{ github.ref_name }}".TrimStart('v')
            if ($t -match '^\d+\.\d+\.\d+') { $ver = $Matches[0] }
          }
          $asm = if ($ver -match '^\d+\.\d+\.\d+$') { "$ver.0" } else { '1.0.0.0' }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$ver"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "assembly=$asm"
          Write-Host "version=$ver assembly=$asm"

      - name: Restore
        run: dotnet restore QuickClip.sln

      - name: Build (Debug)
        run: dotnet build QuickClip.sln -c Debug --no-restore

      - name: Publish single-file (win-x64)
        shell: pwsh
        run: |
          $ver = '${{ steps.ver.outputs.version }}'
          $asm = '${{ steps.ver.outputs.assembly }}'
          New-Item -ItemType Directory -Force -Path publish | Out-Null
          dotnet publish src/QuickClip/QuickClip.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            "-p:Version=$ver" `
            "-p:AssemblyVersion=$asm" `
            "-p:FileVersion=$asm" `
            -o publish
          $exe = 'publish/QuickClip.exe'
          if (-not (Test-Path $exe)) { throw 'QuickClip.exe not found after publish' }
          $len = (Get-Item $exe).Length
          if ($len -lt 1MB) { throw "Artifact suspiciously small: $len bytes" }
          Write-Host "Artifact: $len bytes"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickClip-win-x64-v${{ steps.ver.outputs.version }}
          path: publish/QuickClip.exe
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: publish/QuickClip.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
