name: CI

# push / PR：编译 + 发布冒烟，不发 Release
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore QuickClip.sln

      - name: Build (Debug)
        run: dotnet build QuickClip.sln -c Debug --no-restore -warnaserror

      - name: Publish smoke (framework-dependent installer payload)
        shell: pwsh
        run: |
          $fdd = Join-Path $env:RUNNER_TEMP 'qc-fdd'
          dotnet publish src/QuickClip/QuickClip.csproj `
            -c Release -r win-x64 --self-contained false `
            -p:PublishSingleFile=false `
            -p:Version=1.0.0 `
            -p:AssemblyVersion=1.0.0.0 `
            -p:FileVersion=1.0.0.0 `
            -o $fdd
          $fexe = Join-Path $fdd 'QuickClip.exe'
          if (-not (Test-Path $fexe)) { throw "FDD publish failed: $fexe missing" }
          Write-Host "OK fdd QuickClip.exe $((Get-Item $fexe).Length) bytes"
